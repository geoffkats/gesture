<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manus-X Engine | Code Academy UG</title>
    <script>
      // Safeguard window.fetch against accidental overwrites by node-designed polyfills
      (function() {
        const originalFetch = window.fetch;
        if (originalFetch) {
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return originalFetch; },
              set: function(val) { 
                console.warn('Manus-X Warning: A dependency tried to overwrite window.fetch. Assignment blocked.');
              }
            });
          } catch (e) {
            // Silently ignore if already restricted
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
